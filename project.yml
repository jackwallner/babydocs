name: BabyDocs
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.72.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    GENERATE_INFOPLIST_FILE: NO

schemes:
  BabyDocs:
    build:
      targets:
        BabyDocs: all
    run:
      config: Debug
      storeKitConfiguration: BabyDocs/Services/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      storeKitConfiguration: BabyDocs/Services/Products.storekit
      targets:
        - BabyDocsTests
        - BabyDocsUITests

targets:
  BabyDocs:
    type: application
    platform: iOS
    sources:
      - path: BabyDocs
        excludes:
          - PrivacyInfo.xcprivacy
          - Services/Products.storekit
      - path: Shared
      - path: BabyDocs/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BabyDocs
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.babydocs
        INFOPLIST_FILE: BabyDocs/Info.plist
        CODE_SIGN_ENTITLEMENTS: BabyDocs/BabyDocs.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

  BabyDocsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BabyDocsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.babydocs.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BabyDocs

  BabyDocsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BabyDocsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.babydocs.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BabyDocs
    dependencies:
      - target: BabyDocs
